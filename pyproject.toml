[project]
name = "music-production-skills"
version = "0.1.0"
description = "Tools for producing, rebuilding and checking music with REAPER"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "soundfile>=0.12"]

[project.scripts]
mps = "mps.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mps"]

[tool.pytest.ini_options]
# The FL Studio tests are unittest cases, which pytest also runs. CI installs only requirements-dev.txt, so the
# package is imported from src/ instead of being installed.
testpaths = ["tests", "fl-studio/tests"]
pythonpath = ["src"]
