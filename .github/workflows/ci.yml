name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    secrets:
        name: secrets
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0
                  persist-credentials: false
            # Scans the whole history, since a secret in any commit stays readable in a public repository.
            - name: gitleaks
              run: |
                  docker run --rm -v "$PWD":/repo -w /repo \
                    ghcr.io/gitleaks/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 \
                    git --no-banner --redact .

    lint:
        name: format and lint
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: "3.14"
            - run: pip install -r requirements-dev.txt
            # Scripts in bin/ have no extension, so ruff only sees them when named.
            - run: ruff format --check bin/wav-check bin/instrument-calibrate src poc tests fl-studio/bin/fl-notes fl-studio/bridge fl-studio/tests
            - run: ruff check bin/wav-check bin/instrument-calibrate src poc tests fl-studio/bin/fl-notes fl-studio/bridge fl-studio/tests
            # The REAPER scripts in reaper/ have no tests of their own, so the Lua language server checks them with
            # .luarc.json. It exits with an error when it finds a warning or worse.
            - name: lua-language-server
              run: |
                  curl -sSfL -o luals.tar.gz https://github.com/LuaLS/lua-language-server/releases/download/3.19.2/lua-language-server-3.19.2-linux-x64.tar.gz
                  echo "93ad326b10f6c00911dd8c450fa098332dbd8f9f45d1052f5636a2d54479b947  luals.tar.gz" | sha256sum -c
                  mkdir luals && tar -xzf luals.tar.gz -C luals
                  luals/bin/lua-language-server --check reaper --checklevel=Warning --configpath="$PWD/.luarc.json"

    test:
        name: test on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                # Windows is where REAPER and FL Studio run here, and macOS is left out until something here depends on it.
                os: [ubuntu-latest, windows-latest]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: "3.14"
            - run: pip install -r requirements-dev.txt
            # pytest also runs the unittest cases, and pyproject.toml names both test folders.
            - run: python -m pytest
