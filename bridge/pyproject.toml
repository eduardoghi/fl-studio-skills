[project]
name = "fl-bridge"
version = "0.1.0"
description = "MCP server that controls FL Studio from Claude Code"
requires-python = ">=3.10"
dependencies = ["mcp>=1.30,<2"]

[project.scripts]
fl-bridge = "fl_bridge.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fl_bridge"]
